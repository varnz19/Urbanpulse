services:
  # Backend API & ML Engine
  - type: web
    name: urbanpulse-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./urbanpulse.db
      - key: UPLOAD_DIR
        value: ./data_uploads
      - key: SAMPLE_DATA_DIR
        value: ./app/sample_data

  # Frontend Vite Single Page App (Static Sites do not specify a plan)
  - type: web
    name: urbanpulse-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: urbanpulse_backend
    ports:
      - "8008:8000"
    environment:
      - DATABASE_URL=sqlite:///./urbanpulse.db
      - UPLOAD_DIR=./data_uploads
      - SAMPLE_DATA_DIR=./app/sample_data
    volumes:
      - backend_data:/app/data_uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: urbanpulse_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
